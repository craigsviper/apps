# ╔══════════════════════════════════════════════════════════════╗
# ║  RSW Field Inspection — Development Server                  ║
# ║                                                             ║
# ║  Hot-reload: edit src/ files, browser updates instantly.   ║
# ║  For developers only — not for production or field use.    ║
# ║                                                             ║
# ║  Usage (run from root folder):                             ║
# ║    docker compose -f docker-compose.dev.yml up             ║
# ║    docker compose -f docker-compose.dev.yml down           ║
# ║                                                             ║
# ║  App (hot-reload): http://localhost:8050                   ║
# ╚══════════════════════════════════════════════════════════════╝

services:

  rsw-inspector-dev:
    image: node:20-alpine
    container_name: rsw-inspector-dev
    working_dir: /app
    ports:
      - "8050:5173"
    volumes:
      - .:/app
      - rsw_node_modules:/app/node_modules
    environment:
      - NODE_ENV=development
      - TZ=${TZ:-Pacific/Auckland}
    command: >
      sh -c "
        echo '═══════════════════════════════════════════════'
        echo '  RSW Inspector — Development Server'
        echo '  Edit src/ files — browser reloads instantly'
        echo '═══════════════════════════════════════════════'
        npm install --no-audit --no-fund &&
        echo '  ✅ Dependencies installed' &&
        echo '  🚀 App: http://localhost:8050' &&
        echo '' &&
        npx vite --host 0.0.0.0 --port 5173
      "
    restart: unless-stopped

volumes:
  rsw_node_modules:
    name: rsw_inspector_node_modules
