# BUG FIX (Craig-reported, v72.8): "any way to add more log details from
# the app like the host-server" — this container is nginx serving a
# single-file static SPA (all real app logic runs in the browser and never
# touches this server), so it can never log app *activity* the way the
# Node.js host-server does — that detail only exists in the browser's own
# on-device Debug Log (Health page) and, once synced, in the host-server's
# own logs (which already show it: GET /health, /dashboard, etc.). What WAS
# missing here: a useful log line for real requests, and any way to tell
# them apart from Docker's own HEALTHCHECK (`curl -fsk https://localhost:8050/`
# every 30s, visible in the "before" screenshot as a wall of identical
# "curl/8.17.0" GET / 200 lines with nothing else in between).
#
# rsw_log adds response time, referrer, and user-agent so a real page load
# is distinguishable from a bare healthcheck ping at a glance. $loggable
# (0 for the Docker healthcheck's curl user-agent, 1 for everything else)
# is used with `access_log ... if=` below so the healthcheck no longer
# drowns out real client requests — it still runs, it's just not logged.
log_format rsw_log '[$time_local] $status $request_method $request_uri '
                    '${request_time}s $body_bytes_sent"B" '
                    'client=$remote_addr ref="$http_referer" ua="$http_user_agent"';

map $http_user_agent $loggable {
    ~*^curl/  0;   # Docker HEALTHCHECK — keep it running, just don't log every ping
    default   1;
}

server {
    listen 8050 ssl;
    server_name _;
    access_log /var/log/nginx/access.log rsw_log if=$loggable;

    ssl_certificate     /etc/nginx/ssl/rsw-cert.pem;
    ssl_certificate_key /etc/nginx/ssl/rsw-key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # Redirect plain HTTP to HTTPS instead of showing 400
    error_page 497 https://$host:$server_port$request_uri;

    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 256;
    gzip_vary on;

    add_header X-Content-Type-Options  "nosniff" always;
    add_header X-XSS-Protection        "1; mode=block" always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy      "geolocation=*, camera=*, microphone=()" always;

    # CSP: allow external CDN (Leaflet, Chart.js, Google Fonts)
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://unpkg.com https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://unpkg.com https://cdnjs.cloudflare.com; img-src 'self' data: blob: https: http:; font-src 'self' data: https://fonts.gstatic.com https://cdnjs.cloudflare.com; frame-src https://maps.google.com https://www.openstreetmap.org https://*.arcgisonline.com http:; connect-src 'self' https: http: ws: wss:; worker-src 'self' blob:;" always;

    # Installation guide — serve as static HTML
    location /docs/ {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
    }

    # Single-file app — serve index.html for everything
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # No body-size cap — let the full machine disk determine what can be uploaded.
    # Set to a specific value (e.g. 500M) only if you want to cap uploads.
    client_max_body_size 0;
    error_page 404 /index.html;
    # Note: 5xx errors intentionally NOT redirected to index.html
    # so real server errors surface properly in the browser.
}
